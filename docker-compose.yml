# docker-compose.yaml
version: '3'

services:
    db:
        image: postgres:17
        container_name: db
        restart: always
        volumes:
            - db_data:/var/lib/postgresql/data
        networks:
            - app-network
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: pass
            POSTGRES_DB: devdb
            POSTGRES_HOST_AUTH_METHOD: trust
        ports:
            - "54320:5432"

volumes:
    db_data:

networks:
    app-network:
